name: Package

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check plugin source
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - name: Install pinned workflow linter
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            --output "$archive"
          checksum="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          bin_dir="$RUNNER_TEMP/plugin-check-bin"
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" actionlint
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - run: make check
