[project]
name = "vektor-plugin-checks"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyyaml==6.0.4",
    "ruff==0.17.6",
    "rumdl==0.3.6",
    "zizmor==1.33.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
